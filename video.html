<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>공유하기 전에 3초 · 소개 영상</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; font-family: system-ui, sans-serif; }
  video { width: 100%; height: 100%; object-fit: contain; display: block; }
  button { position: fixed; right: 2vw; bottom: 3vh; font: inherit; font-size: 18px; font-weight: 700; color: #fff; background: rgba(0,0,0,.55); border: 1px solid rgba(255,255,255,.4); border-radius: 999px; padding: 10px 18px; cursor: pointer; transition: opacity .4s; }
  body.idle button { opacity: 0; }
</style>
</head>
<body>
<video id="v" src="media/intro.mp4?v=6" poster="media/intro-poster.jpg" autoplay loop playsinline preload="auto"></video>
<button type="button" id="b">🔇 소리 켜기</button>
<script>
  var v = document.getElementById("v"), b = document.getElementById("b"), t;
  function label() { b.textContent = v.muted ? "🔇 소리 켜기" : "🔊 음소거"; }
  v.play().catch(function () { v.muted = true; label(); v.play().catch(function () {}); });
  b.addEventListener("click", function () { v.muted = !v.muted; v.play().catch(function () {}); label(); });
  document.addEventListener("click", function (e) { if (e.target !== b && v.muted) { v.muted = false; label(); } });
  document.addEventListener("dblclick", function () { if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(function () {}); });
  function wake() { document.body.classList.remove("idle"); clearTimeout(t); t = setTimeout(function () { document.body.classList.add("idle"); }, 3000); }
  document.addEventListener("mousemove", wake); wake();
  setTimeout(label, 500);
</script>
</body>
</html>
